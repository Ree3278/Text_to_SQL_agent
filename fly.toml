# Fly.io configuration. `fly launch` would generate this; it is written by hand so every line is understood.
app = "text-to-sql-agent"      # must be globally unique; change if `fly apps create` says it's taken
primary_region = "lax"          # Los Angeles. Must match the region of the volume (see `fly volumes list`).

[build]
  dockerfile = "Dockerfile"

[env]
  # Not secret, so fine to commit. The API key is NOT here: it is set with `fly secrets set`.
  STATE_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # no visitors -> machine stops, and you stop paying for CPU/RAM
  auto_start_machines = true     # the next visitor wakes it up (a few seconds of cold start)
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "bike_state"          # the volume you create with `fly volumes create bike_state`
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                 # DuckDB is capped at 512MB; Python + LangChain need the rest
