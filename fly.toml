# fly.toml app configuration file generated for text-to-sql-agent on 2026-10-08T20:38:30Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'text-to-sql-agent'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
